name: Update Cursor Agent

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bump pinned version and checksums
        id: bump
        run: ./scripts/update-cursor-agent.sh

      - name: Open pull request
        if: steps.bump.outputs.version != ''
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/cursor-agent-${{ steps.bump.outputs.version }}
          commit-message: "chore: bump Cursor Agent to ${{ steps.bump.outputs.version }}"
          title: "chore: bump Cursor Agent to ${{ steps.bump.outputs.version }}"
          body: |
            Automated bump of the pinned Cursor Agent CLI version and SHA-256 checksums
            (see `scripts/update-cursor-agent.sh`).
          delete-branch: true
