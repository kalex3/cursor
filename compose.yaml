# Example: run a self-hosted Cloud Agent machine against a local workspace. Its
# traffic goes through a WireGuard tunnel (the `wg` service, see
# https://github.com/kalex3/wg) for destinations in the peers' AllowedIPs.
# `WG_KILLSWITCH: "true"` below rejects the rest when that list is a full tunnel.
# The image entrypoint is `agent`.
#
#   cp wg0.conf.example wg0.conf       # from the wg repo; fill in keys/peers, chmod 600
#   cp resolv.conf.example resolv.conf # from the wg repo; the entrypoint fills it from DNS=
#   cp .env.example .env               # then set CURSOR_API_KEY (or `export CURSOR_API_KEY=...`)
#   docker compose up -d               # worker stays up
#   docker compose down
#
# One-off interactive session. Stop the worker first: both use the state volumes
# below, and two agents writing them at once corrupt the CLI state.
#   docker compose stop cursor
#   docker compose run --rm -it cursor -p "explain this repo"
#   docker compose start cursor
#
services:
  cursor:
    image: ghcr.io/kalex3/cursor:latest # pin a sha-<commit> tag or a digest for reproducibility
    pull_policy: always
    init: true # tini as PID 1: forwards signals and reaps zombie processes
    # Share wg's network namespace: every packet the agent sends leaves through the tunnel.
    # Network settings (e.g. published ports) belong to the `wg` service, not here.
    # To run without a VPN, delete this line, `depends_on`, and the `wg` service.
    network_mode: service:wg
    depends_on:
      wg:
        condition: service_healthy # wait for the tunnel to be up
        restart: true # recreate this container when wg restarts, otherwise it keeps a stale netns
    # Uncomment only if you need `ping` inside the container (it needs raw sockets):
    # cap_add:
    #   - NET_RAW
    stdin_open: true
    tty: true
    restart: unless-stopped
    command: ["worker", "start"] # `agent worker start`: self-hosted Cloud Agent machine
    working_dir: /workspace
    # The image runs as UID 1000. If your host UID differs, files in the
    # workspace will be owned by 1000; uncomment to match your host user
    # (and export UID/GID first, e.g. `export UID GID=$(id -g)`).
    # user: "${UID}:${GID}"
    environment:
      # Passed through from your shell or from .env (see .env.example); not set in the container if undefined.
      CURSOR_API_KEY:
      NO_OPEN_BROWSER: ${NO_OPEN_BROWSER:-1}
      # Optional: lets `gh` (and `git` after `gh auth setup-git`) talk to GitHub. Use a fine-grained, repo-scoped token.
      GH_TOKEN:
    volumes:
      # Same file wg writes. Read-only so this container cannot change the resolver.
      - ./resolv.conf:/etc/resolv.conf:ro
      # Your project (read-write).
      - ./workspace:/workspace
      # User-level rules and subagents (apply to every project), mounted from this repo.
      # Read-only: the agent can't change them, so injected text can't persist in them.
      - ./rules:/home/cursor/.cursor/rules:ro
      - ./agents:/home/cursor/.cursor/agents:ro
      - ./skills:/home/cursor/.cursor/skills:ro
      # CLI preferences (model, vim, allowlist). Read-only so a session cannot rewrite them.
      - ./cli-config.json:/home/cursor/.config/cursor/cli-config.json:ro
      # Writable inbox where the agent proposes new/changed rules and agents (see proposals/README.md).
      # You review and merge by hand: `diff -ru rules proposals/rules`.
      - ./proposals:/home/cursor/proposals
      # Persist agent login/config/state between runs. One agent at a time.
      - cursor-state:/home/cursor/.cursor
      - cursor-config:/home/cursor/.config/cursor

  # WireGuard sidecar from https://github.com/kalex3/wg. Needs the `wireguard` kernel module on the host.
  # Traffic only goes through the tunnel for destinations in the peers' AllowedIPs: use
  # `AllowedIPs = 0.0.0.0/0` and `WG_KILLSWITCH: "true"` below to force everything.
  wg:
    image: ghcr.io/kalex3/wg:latest
    pull_policy: always
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    # Compose defaults this to 0. Rootless Podman then fails every healthcheck
    # exec on crun 1.31, because the systemd unit that runs it cannot lower
    # its own oom score to 0. 200 is the score Podman already applies.
    oom_score_adj: 200
    environment:
      # Interface name. The volume below mounts ./wg0.conf at /etc/wg0.conf.
      WG_INTERFACE: wg0
      # Seconds between endpoint re-resolution for stale hostname peers. 0 disables it.
      WG_RERESOLVE_INTERVAL: "30"
      # true rejects traffic that would bypass a full tunnel (0.0.0.0/0 or ::/0).
      # A split tunnel ignores this. Replies to inbound connections are still allowed.
      WG_KILLSWITCH: "false"
    sysctls:
      # Used when a full tunnel marks packets. Harmless for a split tunnel:
      # unmarked packets are looked up the same way either way.
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      # Contains your private key: git-ignored, keep it chmod 600. With rootful Docker and
      # cap_drop: ALL it must be owned by root (`sudo chown root:root wg0.conf`).
      - ./wg0.conf:/etc/wg0.conf:ro
      # Same file in every container that joins this network namespace.
      # Podman would share its own resolv.conf; Docker and nerdctl would not.
      - ./resolv.conf:/etc/resolv.conf
    # Defined here as well, because Podman drops the image's HEALTHCHECK for
    # OCI-format images (e.g. when pulled from GHCR).
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]

volumes:
  cursor-state:
  cursor-config:
