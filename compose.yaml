# Example: run Cursor Agent against a local workspace.
#
#   export CURSOR_API_KEY=...          # or put it in a .env file next to this one
#   docker compose run --rm cursor     # interactive session
#   docker compose run --rm cursor -p "explain this repo"
#
services:
  cursor:
    image: ghcr.io/kalex3/cursor:latest # pin the agent version (e.g. :2026.10.22-27dcf5f) or a digest for reproducibility
    pull_policy: always
    init: true # tini as PID 1: forwards signals and reaps zombie processes
    stdin_open: true
    tty: true
    working_dir: /workspace
    # The image runs as UID 1000. If your host UID differs, files in the
    # workspace will be owned by 1000; uncomment to match your host user
    # (and export UID/GID first, e.g. `export UID GID=$(id -g)`).
    # user: "${UID}:${GID}"
    environment:
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
    volumes:
      # Your project (read-write).
      - ./workspace:/workspace
      # User-level rules and subagents (apply to every project), mounted from this repo.
      # Read-only: the agent can't change them, so injected text can't persist in them.
      - ./rules:/home/cursor/.cursor/rules:ro
      - ./agents:/home/cursor/.cursor/agents:ro
      # Writable inbox where the agent proposes new/changed rules and agents (see proposals/README.md).
      # You review and merge by hand: `diff -ru rules proposals/rules`.
      - ./proposals:/home/cursor/proposals
      # Persist agent login/config/state between runs.
      - cursor-state:/home/cursor/.cursor
      - cursor-config:/home/cursor/.config/cursor

volumes:
  cursor-state:
  cursor-config:
